<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="./css/mainStyle.css">
    <title>FixMyStreet</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                   📍FixMyStreet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!--navbar buttons-->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="mainPage.html">Home</a>
                    <a class="nav-link" href="index.html">Map</a>
                    <a class="nav-link" href="about.html">About</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="main-map-section">
        <div class="main-map-container mt-4 text-center justify">
            <div id="map">
            </div>
        </div>
    </section>



    <section class="report-form-section">
        <div class="container py-5">
            <div class="card report-form-card p-4 shadow-sm">
                <h2 class="mb-4">Submit a problem</h2>
                <form id="reportForm" action="reports" method="post">
                    <div class="mb-3">
                        <label for="issueType" class="form-label">Issue type</label>
                        <select id="issueType" name="issueType" class="form-select" required>
                            <option value="" selected disabled>Select an issue</option>
                            <option value="Pothole">Pothole</option>
                            <option value="Low lights">Low lights</option>
                            <option value="Overflowing trash">Overflowing trash</option>
                            <option value="Traffic light not working">Traffic light not working</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div id="otherIssueContainer" class="mt-3" style="display: none;">
                        <label for="otherIssue" class="form-label">Specify the issue</label>
                        <input
                            type="text"
                            id="otherIssue"
                            name="otherIssue"
                            class="form-control"
                            placeholder="Enter the type of issue"
                        >
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="4" placeholder="Describe the problem and where it is located." required></textarea>
                    </div>
                    <input id="latitude" name="latitude" type="hidden">
                    <input id="longitude" name="longitude" type="hidden">
                    <p id="locationStatus" class="form-text mb-3" aria-live="polite">Click the map or use your location to place a report pin.</p>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">Submit report</button>
                        <button id="useLocation" type="button" class="btn btn-outline-primary">Use my location</button>
                        <button id="removePin" type="button" class="btn btn-outline-secondary" disabled>Remove pin</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container py-4">
            <div class="row gy-3 align-items-center">
                <div class="col-md-5"><a class="footer-brand" href="mainPage.html">📍 FixMyStreet</a><p class="mb-0 mt-2">Helping communities report and follow local street issues.</p></div>
                <div class="col-md-4"><nav class="footer-links" aria-label="Footer navigation"><a href="mainPage.html">Home</a><a href="index.html">Map</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div>
                <div class="col-md-3 text-md-end"><a href="privacy.html" class="footer-policy">Privacy &amp; accessibility</a><p class="mb-0 mt-2">&copy; 2026 FixMyStreet</p></div>
            </div>
        </div>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const issueType = document.getElementById("issueType");
        const otherIssueContainer = document.getElementById("otherIssueContainer");
        const otherIssue = document.getElementById("otherIssue");

        issueType.addEventListener("change", function () {
            if (this.value === "Other") {
                otherIssueContainer.style.display = "block";
                otherIssue.required = true;
            } else {
                otherIssueContainer.style.display = "none";
                otherIssue.required = false;
                otherIssue.value = "";
            }
        });
    </script>
    <script src="./js/map.js"></script>
</body>
</html>
