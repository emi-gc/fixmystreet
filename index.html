<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/mainStyle.css">
    <title>FixMyStreet</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                   📍FixMyStreet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!--navbar buttons-->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="mainPage.html">Home</a>
                    <a class="nav-link" href="index.html">Map</a>
                    <a class="nav-link" href="about.html">About</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="action-buttons-section">
        <div class="action-buttons-container mt-4 text-center">
            <h1 class="report-title">Make a report here</h1>
            <div class="row justify-content-center g-3">
                <div class="col">
                    <button type="button" class="btn btn-outline-warning report-button">Pothole</button>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-outline-warning report-button">low lights</button>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-outline-warning report-button">Overflowing trash</button>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-outline-warning report-button">Traffick light not working</button>
                </div>
            </div>
        </div>
    </section>

    <section class="main-map-section">
        <div class="main-map-container mt-4 text-center justify">
            <div class="card map-card" style="width: 100%;">
                <img src="./images/map.png"
                <div class="card-body">
                    <p class="card-text">Ciudad Granja, Zapopan</p>
                </div>
            </div>
        </div>
    </section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
